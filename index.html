<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>" />
  <title>ASCII TV</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      scrollbar-width: none; /* Firefox — scroll still works, just no visible bar */
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; } /* Chrome/Safari — Safari scrolls <html>, so target both */
    body {
      margin: 0;
      background: #000;
      color: #8a8a8a; /* >=4.5:1 on black for WCAG AA */
      font: 13px/1.6 Menlo, Monaco, "Courier New", monospace;
      text-align: center;
    }
    body.light { background: #fff; color: #666; } /* >=4.5:1 on white */
    .bg-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 1;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid currentColor;
      border-radius: 3px;
      padding: 4px 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    #px-toggle { right: auto; left: 12px; } /* twin of bg-toggle, other corner */

    /* The canvas is fixed and centered; scroll drives its physical size from a
       small centered tube up to the full viewport (the box grows and gains
       glyph cells — it does not magnify). The empty .scroll-region just gives
       the page the scroll length that drives the growth.
       The tube distortion (fisheye, scanlines, vignette, black mask) is all in
       the WebGL shader — the page is just black behind the canvas. */
    .scroll-region { height: 260vh; }
    canvas {
      display: block;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      touch-action: manipulation; /* keep pan/scroll, drop double-tap zoom so dblclick toggles pixels */
    }
    @media (pointer: coarse) {
      .bg-toggle { padding: 12px 16px; } /* >=44px tap target on touch */
    }
    .hint {
      position: fixed;
      bottom: 8px;
      left: 0;
      right: 0;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <button class="bg-toggle" id="bg-toggle">bg</button>
  <button class="bg-toggle" id="px-toggle">ascii</button>
  <canvas id="tv"></canvas>
  <p class="hint">move the mouse over the tube &middot; scroll to grow &middot; press P for pixels</p>
  <script>
    // touch devices: no mouse, no keyboard — swap the hint copy
    if (matchMedia("(pointer: coarse)").matches)
      document.querySelector(".hint").textContent = "touch the tube · scroll to grow · tap ascii/pixels";
    // iOS Safari ignores maximum-scale — kill pinch-zoom via the gesture events
    for (const ev of ["gesturestart", "gesturechange", "gestureend"])
      document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
  </script>
  <div class="scroll-region"></div>

  <script type="module">
    import { mountAsciiPlayer } from "./ascii-player.js";
    // Pass a different clip with ?v=<url>, e.g. index.html?v=myclip.mp4
    const src = new URLSearchParams(location.search).get("v") || "sample.mp4";
    const hint = document.querySelector(".hint");
    const pxBtn = document.getElementById("px-toggle");
    const tv = mountAsciiPlayer(document.getElementById("tv"), src, {
      onError: () => { hint.textContent = "could not load video: " + src; },
      onPixels: (on) => { pxBtn.textContent = on ? "pixels" : "ascii"; }, // fires for button, P key, double-tap
    });
    document.getElementById("bg-toggle").addEventListener("click", () => {
      const light = document.body.classList.toggle("light");
      tv.setBackground(light ? "#ffffff" : "#000000");
    });
    pxBtn.addEventListener("click", () => tv.togglePixels());
  </script>
</body>
</html>

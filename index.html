<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASCII TV</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      display: grid;
      place-items: center;
    }

    /* ---- CRT shell (pure CSS) ---------------------------------------- */
    .tv {
      padding: 2vmin;
      border-radius: 2vmin;
      background: #111;
      box-shadow: 0 0 60px #000 inset, 0 20px 60px #000;
    }

    .screen {
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      background: #020402;
    }

    .screen canvas {
      display: block;
      width: min(90vw, 720px);
      height: auto;
    }

    /* white-background mode: whole page + cabinet + screen go white,
       CRT chrome softened */
    body.light { background: #fff; }
    body.light .tv { background: #fff; box-shadow: none; }
    body.light .screen { background: #fff; }
    body.light .screen::before { opacity: 0.25; }
    body.light .screen::after {
      background: radial-gradient(circle, transparent 70%, rgba(0, 0, 0, 0.2) 100%);
    }
    body.light .bg-toggle { color: #111; }

    .bg-toggle {
      margin-top: 1rem;
      padding: 0;
      border: none;
      background: none;
      color: #eee;
      cursor: pointer;
      font: 700 0.8rem/1 monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* scanlines */
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0,
        rgba(0, 0, 0, 0) 1px,
        rgba(0, 0, 0, 0.35) 1px,
        rgba(0, 0, 0, 0.35) 2px
      );
    }

    /* vignette + flicker */
    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(circle, transparent 60%, rgba(0, 0, 0, 0.6) 100%);
      animation: flicker 0.15s infinite;
    }
    @keyframes flicker {
      0%   { opacity: 0.92; }
      50%  { opacity: 1; }
      100% { opacity: 0.94; }
    }
  </style>
</head>
<body>
  <div class="tv">
    <div class="screen">
      <canvas id="tv"></canvas>
    </div>
  </div>
  <button class="bg-toggle" type="button">white bg</button>

  <script type="module">
    import { mountAsciiPlayer } from "./ascii-player.js";
    const player = await mountAsciiPlayer(document.getElementById("tv"), "seq.json.gz");

    const btn = document.querySelector(".bg-toggle");
    let light = false;
    btn.addEventListener("click", () => {
      light = !light;
      document.body.classList.toggle("light", light);
      player.setBackground(light ? "#ffffff" : "#020402");
      btn.textContent = light ? "dark bg" : "white bg";
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASCII TV</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #000;
      color: #6a6a6a;
      font: 13px/1.6 Menlo, Monaco, "Courier New", monospace;
      text-align: center;
    }
    body.light { background: #fff; color: #888; }
    .bg-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 1;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid currentColor;
      border-radius: 3px;
      padding: 4px 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* The canvas is fixed and centered; scroll drives its physical size from a
       small centered tube up to the full viewport (the box grows and gains
       glyph cells — it does not magnify). The empty .scroll-region just gives
       the page the scroll length that drives the growth.
       The tube distortion (fisheye, scanlines, vignette, black mask) is all in
       the WebGL shader — the page is just black behind the canvas. */
    .scroll-region { height: 260vh; }
    canvas {
      display: block;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .hint {
      position: fixed;
      bottom: 8px;
      left: 0;
      right: 0;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <button class="bg-toggle" id="bg-toggle">bg</button>
  <canvas id="tv"></canvas>
  <p class="hint">move the mouse over the tube &middot; scroll to grow &middot; press P for pixels</p>
  <div class="scroll-region"></div>

  <script type="module">
    import { mountAsciiPlayer } from "./ascii-player.js";
    // Pass a different clip with ?v=<url>, e.g. index.html?v=myclip.mp4
    const src = new URLSearchParams(location.search).get("v") || "sample.mp4";
    const hint = document.querySelector(".hint");
    const tv = mountAsciiPlayer(document.getElementById("tv"), src, {
      onError: () => { hint.textContent = "could not load video: " + src; },
    });
    document.getElementById("bg-toggle").addEventListener("click", () => {
      const light = document.body.classList.toggle("light");
      tv.setBackground(light ? "#ffffff" : "#000000");
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASCII TV</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: grid;
      place-items: center;
    }

    /* The tube distortion (barrel, scanlines, vignette, black mask) is done in
       the WebGL shader — the page is just black behind the canvas. */
    canvas {
      display: block;
      width: min(92vw, 900px);
      height: auto;
    }
  </style>
</head>
<body>
  <canvas id="tv"></canvas>

  <script type="module">
    import { mountAsciiPlayer } from "./ascii-player.js";
    mountAsciiPlayer(document.getElementById("tv"), "seq.json.gz");
  </script>
</body>
</html>
